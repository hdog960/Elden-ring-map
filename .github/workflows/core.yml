name: Core development checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/core.yml'
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check src/app.js && node --check src/storage.js
